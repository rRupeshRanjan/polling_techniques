<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WS Counter (full websocket)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 2rem; }
    #counter { font-size: 3rem; margin: 1rem 0; }
    button { font-size: 1rem; padding: .5rem 1rem; }
    #status { color: gray; margin-top: .5rem; }
  </style>
</head>
<body>
  <h1>WebSocket Counter (full WS)</h1>
  <div id="counter">—</div>
  <button id="inc">Increment</button>
  <div id="status">connecting…</div>

  <script>
    const counterEl = document.getElementById('counter');
    const statusEl = document.getElementById('status');
    const incBtn = document.getElementById('inc');

    let socket;
    function connect() {
      statusEl.textContent = 'connecting...';
      socket = new WebSocket(`ws://${location.hostname}:3000/ws`);

      socket.addEventListener('open', () => {
        statusEl.textContent = 'connected';
      });

      socket.addEventListener('message', (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (typeof data.count !== 'undefined') {
            counterEl.textContent = data.count;
          }
        } catch (err) {
          console.error('invalid message', ev.data, err);
        }
      });

      socket.addEventListener('close', () => {
        statusEl.textContent = 'disconnected — reconnecting in 1s';
        setTimeout(connect, 1000);
      });

      socket.addEventListener('error', (e) => {
        console.error('ws error', e);
      });
    }

    connect();

    incBtn.addEventListener('click', () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: "increment" }));
      } else {
        console.warn('socket not open');
      }
    });
  </script>
</body>
</html>
